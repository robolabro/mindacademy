{% load static %}
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intră în cont - MindAcademy Elevi</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f6f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .lg-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem 2.2rem;
        }
        .lg-logo {
            width: 60px; height: 60px; border-radius: 15px;
            background: #2563eb; color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; font-weight: 700;
            margin: 0 auto 1rem;
        }
        .lg-sub {
            text-align: center; color: #2563eb; font-weight: 700;
            font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase;
            margin-bottom: 0.4rem;
        }
        h1 { font-size: 1.35rem; text-align: center; color: #1f2430; margin-bottom: 0.4rem; }
        .lg-hint { text-align: center; color: #6b7280; font-size: 0.92rem; margin-bottom: 1.6rem; }
        .lg-errors {
            background: #fee2e2; color: #b91c1c;
            border-radius: 10px; padding: 0.7rem 0.9rem;
            font-size: 0.88rem; margin-bottom: 1.1rem;
        }
        .lg-field { margin-bottom: 1.1rem; }
        .lg-field label {
            display: block; font-size: 0.88rem; font-weight: 600;
            color: #374151; margin-bottom: 0.35rem;
        }
        .lg-field input {
            width: 100%; padding: 0.75rem 0.85rem;
            border: 2px solid #d6d9e0; border-radius: 10px;
            font-size: 1rem; outline: none;
        }
        .lg-field input:focus { border-color: #2563eb; }
        .lg-submit {
            width: 100%; background: #2563eb; color: white;
            border: none; border-radius: 10px;
            padding: 0.85rem; font-size: 1rem; font-weight: 700;
            cursor: pointer; transition: background 0.15s ease;
            margin-top: 0.3rem;
        }
        .lg-submit:hover { background: #1d4ed8; }
        .lg-footer { text-align: center; margin-top: 1.2rem; font-size: 0.83rem; color: #9ca3af; }
        .lg-footer a { color: #6b7280; }
    </style>
</head>
<body>
    <div class="lg-card">
        <div class="lg-logo">心</div>
        <div class="lg-sub">Platforma Elevilor</div>
        <h1>Bine ai venit! 👋</h1>
        <p class="lg-hint">Intră cu username-ul și parola primite de la profesorul tău.</p>

        {% if form.errors %}
        <div class="lg-errors">Username sau parolă greșită. Mai încearcă o dată!</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="lg-field">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" required autofocus autocomplete="username">
            </div>
            <div class="lg-field">
                <label for="id_password">Parolă</label>
                <input type="password" name="password" id="id_password" required autocomplete="current-password">
            </div>
            <input type="hidden" name="next" value="{{ next|default:'/dupa-login/' }}">
            <button type="submit" class="lg-submit">Intră în cont</button>
        </form>

        <div class="lg-footer">
            Ești profesor? <a href="{% url 'login' %}">Intră aici</a>
        </div>
    </div>
</body>
</html>
